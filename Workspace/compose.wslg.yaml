# WSLg override: use the Windows GPU interface through /dev/dxg.
# Merged by launch-dentoworkflow.bash when graphics mode is wslg.
# Mesa selects the adapter unless DENTOBOT_WSLG_ADAPTER_NAME is set.

services:
  slicerros2:
    devices: !reset []
    environment:
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
      PULSE_SERVER: unix:/mnt/wslg/PulseServer
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      MESA_D3D12_DEFAULT_ADAPTER_NAME: ${DENTOBOT_WSLG_ADAPTER_NAME:-}
      GALLIUM_DRIVER: d3d12
      LIBGL_ALWAYS_SOFTWARE: "0"
      QT_X11_NO_MITSHM: "1"
      QT_OPENGL: desktop
    volumes:
      - /mnt/wslg:/mnt/wslg:rw
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - /dev/dxg:/dev/dxg
