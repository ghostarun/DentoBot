# NVIDIA GPU access for rendering and/or CUDA inference inside the SlicerROS2 container.
# Merged for DENTOBOT_GRAPHICS_MODE=nvidia or DENTOBOT_BACKEND_DEVICE=cuda:0.

services:
  slicerros2:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,display
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
