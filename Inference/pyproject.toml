[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dentobot-inference"
version = "0.2.0"
description = "External WSL2 inference boundary for the DENTOBOT research workflow"
requires-python = ">=3.10"
dependencies = [
  "nibabel>=5.2,<6",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
segmentation = ["TotalSegmentator>=2.11,<3"]

[project.scripts]
dentobot-inference = "dentobot_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
